spring.application.name=cqrs-es-axon
spring.datasource.url=jdbc:h2:mem:accounts-db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.async.request-timeout=5m
spring.profiles.group.axon=postgres
springdoc.paths-to-exclude=/command/**

axon.axonserver.enabled=false
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.eventhandling.processors.accounts.mode=tracking
