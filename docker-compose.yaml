services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: es-accounts
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d es-accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin4:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: solayman@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin1234}
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  axonserver:
    image: axoniq/axonserver:${AXON_SERVER_VERSION:-2024.2.5}
    hostname: axonserver
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
    ports:
      - "127.0.0.1:8024:8024"
      - "127.0.0.1:8124:8124"
    volumes:
      - axon-data:/axonserver/data
      - axon-events:/axonserver/events

volumes:
  postgres-data:
  pgadmin-data:
  axon-data:
  axon-events:
